<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Porträt-Klassifikation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{--ink:#14171c;--panel:#1c2128;--line:rgba(233,228,218,.11);--text:#e9e4da;--muted:#9ea4ad;--brass:#c9a35a;--brass-dim:#7d6430;
--f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;--f-body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--f-mono:ui-monospace,"SF Mono",Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:1180px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-bottom:20px}
.eyebrow{margin:0;width:100%;font:500 11px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
h1{margin:0;font:italic 600 clamp(30px,5vw,42px)/1.05 var(--f-display);text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%}
@media (min-width:720px){.top .tabs{width:auto;margin:0 0 0 auto}}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:11px 10px;border-radius:9px;font-weight:600;font-size:14px;min-height:44px;white-space:nowrap}
@media (min-width:720px){.tab{flex:none;padding:11px 18px;font-size:15px}}
.tab[aria-selected="true"]{background:var(--brass);color:#1a1409}
.tab:focus-visible,.chip:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.grid{display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px) and (orientation:landscape){.grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:start}}
.stagerow{display:flex;gap:12px;align-items:flex-start;justify-content:center}
.side{width:92px;flex:none;color:var(--muted);text-align:center}
.side .cap{margin:6px 0 0;font:500 10px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
#sideview{display:block;width:92px;height:auto}
#minimap{position:relative;margin:0 auto;border-radius:3px;overflow:hidden;background:#c1c1c1;box-shadow:0 0 0 1px var(--line)}
#minimap img{display:block;width:100%;height:100%}
#minimap .win{position:absolute;left:0;right:0;border-top:2px solid var(--brass);border-bottom:2px solid var(--brass);box-shadow:0 0 0 999px rgba(20,23,28,.62)}
.frame{position:relative;flex:none;padding:clamp(9px,1.6vw,14px);border-radius:3px;background:linear-gradient(135deg,#dcc283 0%,#a98238 22%,#e6cd8a 46%,#8f6c2a 70%,#c9a35a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.45),0 22px 44px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.5)}
.frame::after{content:"";position:absolute;inset:clamp(9px,1.6vw,14px);pointer-events:none;box-shadow:0 0 0 2px #5b4318,inset 0 0 0 1px rgba(0,0,0,.4),inset 0 8px 16px rgba(0,0,0,.32)}
#cv{display:block;touch-action:pan-x;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#c1c1c1}
.control{max-width:520px;margin:20px auto 0}
.ctl+.ctl{margin-top:18px}
.ctl-head{display:flex;justify-content:space-between;gap:10px;font:500 11px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ctl-head b{color:var(--text);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:48px;margin:0;background:transparent;touch-action:pan-x}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--brass-dim),#3a3f48)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--brass-dim),#3a3f48)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;border-radius:50%;margin-top:-13px;background:var(--brass);border:4px solid var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--brass);border:4px solid var(--ink)}
.ticks{display:flex;justify-content:space-between;padding:0 17px;height:22px}
.tick{position:relative;width:0}
.tick span{position:absolute;left:0;top:0;transform:translateX(-50%);white-space:nowrap;font:500 11px/1 var(--f-mono);color:var(--muted)}
.tick i{position:absolute;left:-3px;top:2px;width:6px;height:6px;border-radius:50%;background:#3a3f48}
.tick.on span{color:var(--brass)}.tick.on i{background:var(--brass)}
.hint{margin:8px 0 0;text-align:center;font-size:12px;color:var(--muted)}
.info{min-width:0}
.kicker{margin:0 0 6px;font:500 11px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
h2{margin:0;font:italic 600 clamp(32px,5vw,48px)/1.04 var(--f-display);text-wrap:balance}
.meta{margin:8px 0 18px;font:500 12px/1.3 var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.fade{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
dl{margin:0;display:grid;gap:16px}
dt{font:500 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
dt em{font-style:normal;margin-left:8px;padding:2px 7px;border:1px solid var(--line);border-radius:99px;letter-spacing:.04em;text-transform:none}
dd{margin:0;font-size:16px;line-height:1.55;max-width:60ch}
dd.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:17px}
dd.bsp{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:20px;color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 0}
.chip{min-height:44px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:rgba(201,163,90,.1)}
.note{margin:22px 0 0;font-size:13px;color:var(--muted);max-width:60ch;border-top:1px solid var(--line);padding-top:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{background:#14171c}</style>
</head>
<body>

<div class="app">
  <header class="top">
    <p class="eyebrow">Kunst LK · Bildnis</p>
    <h1>Porträt-Klassifikation</h1>
    <p class="sub">Ausrichtung und Abstand verändern, der Fachbegriff erscheint zum Bild.</p>
    <div class="tabs" role="tablist" aria-label="Ansicht">
      <button class="tab" role="tab" id="tab-head" aria-selected="true">Ausrichtung zum Betrachter</button>
      <button class="tab" role="tab" id="tab-crop" aria-selected="false">Bildausschnitt</button>
    </div>
  </header>

  <main class="grid">
    <section>
      <div class="stagerow">
        <aside class="side">
          <svg id="sideview" viewBox="0 0 96 124" role="img" aria-label="Seitenansicht: Kamerahöhe zur Person">
            <text x="48" y="10" text-anchor="middle" fill="currentColor" font-size="8" font-family="ui-monospace,Menlo,monospace" letter-spacing="1">SEITE</text>
            <line x1="6" y1="60" x2="90" y2="60" stroke="#4a515c" stroke-width="1" stroke-dasharray="3 3"/>
                        <circle cx="48" cy="60" r="16" fill="#252b33" stroke="#4a515c" stroke-width="1.5"/>
            <line id="sightline" x1="20" y1="60" x2="48" y2="60" stroke="#c9a35a" stroke-width="1.5" stroke-dasharray="2 2"/>
            <circle id="camdot" cx="20" cy="60" r="5" fill="#c9a35a"/>
            <text id="deg" x="48" y="112" text-anchor="middle" fill="#e9e4da" font-size="11" font-family="ui-monospace,Menlo,monospace">0°</text>
          </svg>
          <div id="minimap" hidden><img id="miniimg" alt=""><div class="win" id="miniwin"></div></div>
          <p class="cap" id="sidecap">Kamera seitlich</p>
        </aside>
        <div class="frame"><canvas id="cv" role="img" aria-label="Porträt im Bilderrahmen"></canvas></div>
      </div>

      <div class="control">
        <div class="ctl" id="ctlCrop" hidden>
          <div class="ctl-head"><span>weit</span><b>Ausschnitt</b><span>nah</span></div>
          <input type="range" id="sliderCrop" min="0" max="6" step="0.01" value="0" aria-label="Bildausschnitt">
          <div class="ticks" id="ticksCrop" aria-hidden="true"></div>
        </div>
        <div class="ctl" id="ctlHeight">
          <div class="ctl-head"><span id="lblL">Untersicht</span><b>Ausrichtung</b><span id="lblR">Aufsicht</span></div>
          <input type="range" id="sliderH" min="0" max="5" step="1" value="2" aria-label="Ausrichtung zum Betrachter">
          <div class="ticks" id="ticksH" aria-hidden="true"></div>
          <p class="hint" id="hint"></p>
        </div>
      </div>
    </section>

    <section class="info" aria-live="polite">
      <p class="kicker" id="kicker"></p>
      <h2 id="term"></h2>
      <p class="meta" id="meta"></p>
      <dl>
        <div id="rowMerkmal"><dt>Merkmal</dt><dd id="merkmal"></dd></div>
        <div id="rowWirkung"><dt>Wirkung<em hidden></em></dt><dd class="box" id="wirkung"></dd></div>
        <div id="rowAusr" hidden><dt>Ausrichtung</dt><dd class="box" id="ausr"></dd></div>
        <div id="rowBsp"><dt>Beispiel</dt><dd class="bsp" id="bsp"></dd></div>
      </dl>
      <div class="chips" id="chips" role="group"></div>
      <p class="note" id="note"></p>
    </section>
  </main>
</div>

function $(s){return document.querySelector(s);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
var cv=$("#cv"),ctx=cv.getContext("2d");
var tab="head",CW=0,CH=0,ready=false,imgs={heads:[],bodies:[]};
var hIdx=2,hPrev=2,hT=1,cropPos=0,animT=null,fadeStart=0,raf=0;
var HEAD_MAX=0,BODY_HREF=0;

function loadImg(src){return new Promise(function(r){var i=new Image();i.onload=function(){r(i);};i.onerror=function(){r(i);};i.src=src;});}
Promise.all(DATA.heads.map(function(h){return loadImg(h.src);}).concat(DATA.bodies.map(function(b){return loadImg(b.src);}))).then(function(a){
  imgs.heads=a.slice(0,6);imgs.bodies=a.slice(6);
  HEAD_MAX=Math.max.apply(null,DATA.heads.map(function(h){return h.h;}));
  BODY_HREF=DATA.bodies.reduce(function(s,b){return s+(b.h-2*PAD);},0)/DATA.bodies.length;
  ready=true;layout();
});

/* ---------- Zeichnen ---------- */
function drawHead(k,alpha){
  var im=imgs.heads[k],h=DATA.heads[k];if(!im.complete&&!im.naturalWidth)return;
  var s=CH*0.92/HEAD_MAX;
  ctx.globalAlpha=alpha;
  ctx.drawImage(im,CW/2-h.w*s/2,CH*0.96-h.h*s,h.w*s,h.h*s);
  ctx.globalAlpha=1;
}
function cropAt(pos){
  var i=Math.min(Math.floor(pos),CROPS.length-2),f=pos-i;
  if(i<0)i=0;
  if(pos>=CROPS.length-1){return CROPS[CROPS.length-1];}
  var a=CROPS[i],b=CROPS[i+1];
  return {t:a.t+(b.t-a.t)*f,b:a.b+(b.b-a.b)*f};
}
function drawBody(k,alpha,c){
  var im=imgs.bodies[k],d=DATA.bodies[k],Hf=d.h-2*PAD;
  var s=CH/((c.b-c.t)*BODY_HREF);
  ctx.globalAlpha=alpha;
  ctx.drawImage(im,CW/2-d.w*s/2,-(PAD+c.t*Hf)*s,d.w*s,d.h*s);
  ctx.globalAlpha=1;
  return {top:PAD+c.t*Hf,bot:PAD+c.b*Hf,h:d.h};
}
function render(){
  if(!CW||!ready)return;
  ctx.fillStyle="#c1c1c1";ctx.fillRect(0,0,CW,CH);
  var fadeA=hT<1?hT:1;
  if(tab==="head"){
    if(hT<1)drawHead(hPrev,1-hT);
    drawHead(hIdx,fadeA);
  }else{
    var c=cropAt(cropPos);
    if(hT<1)drawBody(hPrev,1-hT,c);
    var win=drawBody(hIdx,fadeA,c);
    var mw=$("#miniwin");
    mw.style.top=(win.top/win.h*100)+"%";mw.style.height=((win.bot-win.top)/win.h*100)+"%";
  }
  var g=ctx.createRadialGradient(CW/2,CH*.42,Math.min(CW,CH)*.3,CW/2,CH*.5,Math.max(CW,CH)*.8);
  g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.24)");
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
}
function anim(){
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(function step(now){
    var more=false;
    if(hT<1){hT=clamp((now-fadeStart)/220,0,1);more=hT<1;}
    if(animT){var u=clamp((now-animT.t0)/animT.d,0,1),e=1-Math.pow(1-u,3);
      cropPos=animT.a+(animT.b-animT.a)*e;if(u<1)more=true;else animT=null;}
    render();
    if(more)raf=requestAnimationFrame(step);
  });
}

/* ---------- Layout ---------- */
function layout(){
  var stage=$("#cv").parentNode.parentNode.parentNode;
  var two=matchMedia("(min-width:720px) and (orientation:landscape)").matches;
  var availW=stage.clientWidth-92-12-40;
  var availH=two?innerHeight-300:innerHeight*.55;
  var fh=clamp(Math.min(availW/.75,availH,680),240,680);
  var dpr=Math.min(window.devicePixelRatio||1,3),w=Math.round(fh*.75),h=Math.round(fh);
  cv.style.width=w+"px";cv.style.height=h+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);CW=cv.width;CH=cv.height;
  var mm=$("#minimap");var mh=Math.min(h*.8,298);mm.style.height=mh+"px";
  mm.style.width=(mh*DATA.bodies[0].w/DATA.bodies[0].h)+"px";
  render();
}
addEventListener("resize",layout);
addEventListener("orientationchange",function(){setTimeout(layout,250);});

/* ---------- Seitenansicht: Kamerawinkel ---------- */
function sideView(deg){
  var a=deg*Math.PI/180,R=44,cx=48,cy=60;
  var px=cx-R*Math.cos(a),py=cy-R*Math.sin(a);
  $("#sightline").setAttribute("x1",px.toFixed(1));$("#sightline").setAttribute("y1",py.toFixed(1));
  $("#sightline").setAttribute("x2",cx);$("#sightline").setAttribute("y2",cy);
  $("#camdot").setAttribute("cx",px.toFixed(1));$("#camdot").setAttribute("cy",py.toFixed(1));
  $("#deg").textContent=(deg>0?"+":"")+deg+"°";
  $("#sidecap").textContent=deg===0?"Augenhöhe":(deg<0?"Kamera unten":"Kamera oben");
}

function ticks(id,labels){
  var t=$(id);t.innerHTML="";
  labels.forEach(function(l){var e=document.createElement("div");e.className="tick";e.innerHTML=(l?"":"<i></i>")+"<span></span>";e.querySelector("span").textContent=l;t.appendChild(e);});
}
function markTicks(id,idx){document.querySelectorAll(id+" .tick").forEach(function(t,k){t.classList.toggle("on",k===idx);});}
function buildChips(list,onPick,active){
  var c=$("#chips");c.innerHTML="";
  list.forEach(function(it,k){
    var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=it.short;
    b.setAttribute("aria-pressed",k===active?"true":"false");
    b.addEventListener("click",function(){onPick(k);});c.appendChild(b);
  });
}
function showInfo(){
  var H=HEIGHTS[hIdx];
  if(tab==="head"){
    setText("#kicker","Ausrichtung zum Betrachter");
    setText("#term",H.name);
    setText("#meta","Kamera "+(H.deg===0?"auf Augenhöhe":(H.deg<0?"unter":"über")+" Augenhöhe, ca. "+Math.abs(H.deg)+"°"));
    setText("#merkmal",H.merkmal);setText("#wirkung",H.wirkung);
    $("#rowAusr").hidden=true;$("#rowBsp").hidden=true;
    setText("#note",NOTE_H);
    buildChips(HEIGHTS,function(k){setH(k);},hIdx);
  }else{
    var idx=Math.min(Math.round(cropPos),CROPS.length-1),C=CROPS[idx];
    setText("#kicker","Bildausschnitt · "+H.short);
    setText("#term",C.name);
    setText("#meta","Stufe "+(idx+1)+" von "+CROPS.length+" · Ausrichtung "+(H.deg===0?"Augenhöhe":(H.deg<0?"Untersicht":"Aufsicht")));
    setText("#merkmal",C.merkmal);setText("#wirkung",C.wirkung);
    setText("#ausr",H.name+": "+H.wirkung);
    $("#rowAusr").hidden=false;$("#rowBsp").hidden=false;setText("#bsp",C.bsp);
    setText("#note",NOTE_C);
    buildChips(CROPS,function(k){setCrop(k,true);},idx);
  }
  fadeEls();
  $("#sliderH").setAttribute("aria-valuetext",H.name);
}
function setH(k){
  k=clamp(Math.round(k),0,5);
  if(k!==hIdx){hPrev=hIdx;hIdx=k;hT=0;fadeStart=performance.now();anim();}
  $("#sliderH").value=k;
  sideView(HEIGHTS[k].deg);
  markTicks("#ticksH",k);
  $("#hint").textContent=tab==="head"?"Regler oder vertikal über das Bild wischen.":"";
  $("#lblL").textContent=HEIGHTS[0].short;$("#lblR").textContent=HEIGHTS[5].short;
  var mi=$("#miniimg");if(mi&&DATA.bodies[k])mi.src=DATA.bodies[k].src;
  showInfo();
  render();
}
function setCrop(p,animate){
  p=clamp(p,0,CROPS.length-1);
  if(animate){animT={a:cropPos,b:p,t0:performance.now(),d:380};anim();}
  else{cropPos=p;render();}
  $("#sliderCrop").value=p;
  markTicks("#ticksCrop",Math.round(p));
  if(!animate)showInfo();
}

/* ---------- Tabs ---------- */
function setTab(name){
  tab=name;var head=name==="head";
  $("#tab-head").setAttribute("aria-selected",head);$("#tab-crop").setAttribute("aria-selected",!head);
  $("#ctlCrop").hidden=head;
  $("#minimap").hidden=head;$("#sideview").style.display="block";
  $("#sidecap").style.display="block";
  if(head){
    $("#sideview").setAttribute("aria-label","Seitenansicht: Kamerahöhe zur Person");
    buildChips(HEIGHTS,function(k){setH(k);},hIdx);
    ticks("#ticksH",HEIGHTS.map(function(h){return h.deg===0?"0°":(h.deg>0?"+":"")+h.deg+"°";}));
    setText("#note",NOTE_H);
    cropPos=0;
  }else{
    ticks("#ticksCrop",CROPS.map(function(){return "";}));
    ticks("#ticksH",HEIGHTS.map(function(h){return h.deg===0?"0°":(h.deg>0?"+":"")+h.deg+"°";}));
    setText("#note",NOTE_C);
    setCrop(cropPos,false);
  }
  setH(hIdx);
  render();
}
$("#tab-head").addEventListener("click",function(){if(tab!=="head")setTab("head");});
$("#tab-crop").addEventListener("click",function(){if(tab!=="crop")setTab("crop");});

$("#sliderH").addEventListener("input",function(e){setH(+e.target.value);});
$("#sliderCrop").addEventListener("input",function(e){cropPos=+e.target.value;render();markTicks("#ticksCrop",Math.round(cropPos));showInfo();});
$("#sliderCrop").addEventListener("change",function(e){setCrop(Math.round(+e.target.value),true);});

/* Wischen auf dem Bild: vertikal wechselt die Ausrichtung */
var sy=null,sh=2;
cv.addEventListener("pointerdown",function(e){sy=e.clientY;sh=hIdx;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener("pointermove",function(e){
  if(sy===null)return;
  var d=Math.round((sy-e.clientY)/(cv.clientHeight/7));
  setH(clamp(sh+d,0,5));
});
function endS(){sy=null;}
cv.addEventListener("pointerup",endS);cv.addEventListener("pointercancel",endS);

setTab("head");
layout();
})();
</script>

</body>
</html>
